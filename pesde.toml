name = "idkaboutbytes/baseobject"
version = "1.0.0"
description = "BaseObject package for Roblox."
license = "MIT"
authors = ["idkaboutbytes"]
repository = "https://github.com/idkaboutbytes/baseobject"
includes = [
    "pesde.toml",
    "README.md",
    "CHANGELOG.md",
    "default.project.json",
    "src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Loader = { repo = "idkaboutbytes/loader", rev = "v1.0.0" }
Maid = { repo = "idkaboutbytes/maid", rev = "v1.0.0" }
